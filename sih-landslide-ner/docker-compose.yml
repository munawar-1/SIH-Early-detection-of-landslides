version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: landslide_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml-api:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      - MODEL_ENV=development

volumes:
  postgres_data:
